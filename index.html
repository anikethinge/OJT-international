<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EventPass — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='%23070d1c'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%2338bdf8'/%3E%3Cellipse cx='32' cy='32' rx='21' ry='8.5' transform='rotate(-26 32 32)' stroke='%237dd3fc' stroke-width='2.4'/%3E%3Ccircle cx='48' cy='24' r='3' fill='%23ffffff'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #070b16;
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, 0.68);
      --accent: #38bdf8;
      --accent-2: #2563eb;
      --glass: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.2);
      --danger: #fb7185;
    }
    body.lagoon {
      --bg: #05131c;
      --accent: #22d3ee;
      --accent-2: #0284c7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      gap: 18px;
      overflow-x: hidden;
    }
    .aurora {
      position: fixed;
      inset: -15%;
      pointer-events: none;
      filter: blur(85px);
      opacity: 0.72;
      z-index: 0;
    }
    .aurora span { position: absolute; border-radius: 50%; }
    .aurora span:nth-child(1) { width: 380px; height: 380px; top: 6%; left: 10%; background: rgba(37, 99, 235, 0.55); }
    .aurora span:nth-child(2) { width: 340px; height: 340px; bottom: 8%; right: 10%; background: rgba(56, 189, 248, 0.45); }
    .aurora span:nth-child(3) { width: 260px; height: 260px; top: 45%; left: 45%; background: rgba(99, 102, 241, 0.35); }

    .shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 18px;
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
    }
    .theme-btn {
      min-height: 34px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .panel {
      width: 100%;
      padding: 26px 22px;
      border-radius: 26px;
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(175%);
      -webkit-backdrop-filter: blur(28px) saturate(175%);
      border: 1px solid var(--border);
      box-shadow: 0 28px 65px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .head h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.02em; }
    .head p { margin: 0; font-size: 13.5px; color: var(--muted); }

    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border-radius: 14px;
      background: rgba(7, 11, 22, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .role-btn {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .role-btn.is-active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(37, 99, 235, 0.32));
      border-color: rgba(125, 211, 252, 0.45);
      color: #fff;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 12.5px;
      font-weight: 600;
      color: rgba(248, 250, 252, 0.85);
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(7, 11, 22, 0.52);
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .toggle-pw {
      position: absolute;
      right: 8px;
      min-height: 32px;
      padding: 4px 10px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    #pinGroup { display: none; }
    #pinGroup.is-visible { display: flex; }

    .error-msg {
      display: none;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(251, 113, 133, 0.14);
      border: 1px solid rgba(251, 113, 133, 0.45);
      color: #fecdd3;
      font-size: 13px;
      font-weight: 600;
    }
    .error-msg.is-show { display: block; }

    .submit-btn {
      width: 100%;
      min-height: 48px;
      margin-top: 4px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.42);
      transition: transform 0.15s ease, filter 0.2s ease;
    }
    .submit-btn:hover { filter: brightness(1.06); }
    .submit-btn:active { transform: scale(0.97); }

    footer {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }
    footer strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="shell">
    <div class="top-bar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 64 64" fill="none" style="border-radius:8px">
          <defs><linearGradient id="g1" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#2563eb"/></linearGradient></defs>
          <rect x="4" y="4" width="56" height="56" rx="16" fill="#070d1c" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
          <circle cx="32" cy="32" r="10" fill="url(#g1)"/>
          <ellipse cx="32" cy="32" rx="21" ry="8.5" transform="rotate(-26 32 32)" stroke="#7dd3fc" stroke-width="2.4"/>
          <circle cx="48" cy="24" r="3" fill="#ffffff"/>
        </svg>
        EventPass
      </div>
      <button id="themeBtn" type="button" class="theme-btn">Theme: Dusk</button>
    </div>

    <main class="panel">
      <div class="head">
        <h1>Sign in</h1>
        <p>Access your campus event passes and dashboard.</p>
      </div>

      <div class="role-tabs" role="tablist">
        <button id="tabAttendee" type="button" class="role-btn is-active" role="tab" aria-selected="true">Attendee</button>
        <button id="tabOrganizer" type="button" class="role-btn" role="tab" aria-selected="false">Organizer</button>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="emailInput">Email</label>
          <input id="emailInput" type="email" placeholder="you@polaris.edu" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="passwordInput">Password</label>
          <div class="input-wrap">
            <input id="passwordInput" type="password" placeholder="Enter password" autocomplete="current-password" style="padding-right:70px;" required />
            <button id="togglePwBtn" type="button" class="toggle-pw">Show</button>
          </div>
        </div>

        <div id="pinGroup" class="field">
          <label for="pinInput">PIN</label>
          <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="one-time-code" />
        </div>

        <div id="formError" class="error-msg" role="alert"></div>

        <button id="signInBtn" type="submit" class="submit-btn">Sign In</button>
      </form>
    </main>

    <footer>
      <div>© 2026 <strong>EventPass</strong> — <strong>Polaris School of Technology</strong> OJT Project by <strong>Aniket Hinge</strong>.</div>
    </footer>
  </div>

  <script>
    let currentRole = "attendee";

    const tabAttendee = document.getElementById("tabAttendee");
    const tabOrganizer = document.getElementById("tabOrganizer");
    const pinGroup = document.getElementById("pinGroup");
    const pinInput = document.getElementById("pinInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const formError = document.getElementById("formError");

    function showError(msg) {
      formError.textContent = msg;
      formError.classList.add("is-show");
    }
    function clearError() {
      formError.textContent = "";
      formError.classList.remove("is-show");
    }

    function setRole(role) {
      currentRole = role;
      const isOrg = role === "organizer";
      tabAttendee.classList.toggle("is-active", !isOrg);
      tabAttendee.setAttribute("aria-selected", String(!isOrg));
      tabOrganizer.classList.toggle("is-active", isOrg);
      tabOrganizer.setAttribute("aria-selected", String(isOrg));
      pinGroup.classList.toggle("is-visible", isOrg);
      clearError();
      if (!isOrg) pinInput.value = "";
    }

    tabAttendee.addEventListener("click", () => setRole("attendee"));
    tabOrganizer.addEventListener("click", () => setRole("organizer"));

    document.getElementById("togglePwBtn").addEventListener("click", (e) => {
      const showing = passwordInput.type === "text";
      passwordInput.type = showing ? "password" : "text";
      e.target.textContent = showing ? "Show" : "Hide";
    });

    document.getElementById("themeBtn").addEventListener("click", (e) => {
      const isLagoon = document.body.classList.toggle("lagoon");
      e.target.textContent = isLagoon ? "Theme: Lagoon" : "Theme: Dusk";
    });

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      clearError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const pin = pinInput.value.trim();

      if (!email || !email.includes("@")) {
        showError("Please enter a valid email address.");
        emailInput.focus();
        return;
      }
      if (!password) {
        showError("Please enter your password.");
        passwordInput.focus();
        return;
      }

      let staffRole = "attendee";
      if (currentRole === "organizer") {
        if (pin !== "1234" && pin !== "9999") {
          showError("Invalid PIN.");
          pinInput.focus();
          return;
        }
        staffRole = pin === "1234" ? "volunteer" : "organizer";
      }

      const rawName = email.split("@")[0].replace(/[._-]+/g, " ").trim();
      const displayName = rawName ? rawName.charAt(0).toUpperCase() + rawName.slice(1) : "Aniket";

      localStorage.setItem("eventpass_user", JSON.stringify({
        name: displayName,
        email: email,
        role: currentRole,
        staffRole: staffRole
      }));

      window.location.href = "home.html";
    });
  </script>
</body>
</html>
